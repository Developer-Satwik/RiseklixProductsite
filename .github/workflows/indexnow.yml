name: Verify production and notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "public/**/*.html"
      - "public/_redirects"
      - "public/sitemap.xml"
      - "public/robots.txt"
      - "public/91c6d8f7a42e4b90bd8a6e3f5c1702aa.txt"
      - ".github/workflows/indexnow.yml"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify production is serving the current site
        shell: bash
        env:
          INDEXNOW_KEY: "91c6d8f7a42e4b90bd8a6e3f5c1702aa"
        run: |
          set -euo pipefail
          ok=0
          for attempt in {1..18}; do
            home="$(curl -fsSL --connect-timeout 8 --max-time 15 https://riseklix.com/ || true)"
            live_key="$(curl -fsSL --connect-timeout 8 --max-time 15 https://riseklix.com/91c6d8f7a42e4b90bd8a6e3f5c1702aa.txt || true)"
            if printf '%s' "$home" | grep -q 'data-page="home"' \
              && ! printf '%s' "$home" | grep -q "Commercial Discovery" \
              && [ "$live_key" = "$INDEXNOW_KEY" ]; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Production verification failed. Not notifying IndexNow while riseklix.com is stale or the key file is not live."
            exit 1
          fi

      - name: Build changed canonical URL list
        id: urls
        shell: bash
        env:
          INDEXNOW_KEY_FILE: "public/91c6d8f7a42e4b90bd8a6e3f5c1702aa.txt"
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          git diff --no-renames --name-status "$BEFORE" "${GITHUB_SHA}" > /tmp/changed.txt

          python - <<'PY'
          from pathlib import Path
          import os

          changed = Path("/tmp/changed.txt").read_text().splitlines()
          urls = []
          key_file = os.environ["INDEXNOW_KEY_FILE"]
          key_added = False
          SITE = "https://riseklix.com/"

          def add(url):
              if url not in urls:
                  urls.append(url)

          def page_url(path):
              """The public address of an HTML file, or None if it has none."""
              if path == "index.html":
                  return SITE
              if path == "404.html":
                  return None
              if path.endswith("/index.html"):
                  return SITE + path[:-10]
              if path.endswith(".html") and "/" not in path:
                  return SITE + path
              return None

          for line in changed:
              parts = line.split("\t")
              if len(parts) < 2:
                  continue
              status, path = parts[0], parts[-1]
              if path == key_file and status.startswith("A"):
                  key_added = True
              if path.startswith("public/"):
                  rel = path[len("public/"):]
                  url = page_url(rel)
                  if url:
                      add(url)
                  elif rel == "robots.txt":
                      add(SITE + "robots.txt")
              elif status.startswith("D") and not path.startswith((".github/", "netlify/")):
                  # a page from the old layout was removed: tell IndexNow so the redirect is picked up
                  url = page_url(path)
                  if url:
                      add(url)

          if key_added:
              for tail in ["", "ai-discovery-study/", "pricing/", "how-it-works/", "market-research/", "case-studies/",
                           "about/", "contact/", "resources/", "authors/satwik-kumar/"]:
                  add(SITE + tail)

          Path("/tmp/indexnow-urls.txt").write_text("\n".join(urls) + ("\n" if urls else ""))
          print(f"Prepared {len(urls)} IndexNow URL(s).")
          for u in urls:
              print(u)
          PY

          if [ ! -s /tmp/indexnow-urls.txt ]; then
            echo "has_urls=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_urls=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit changed URLs to IndexNow
        if: steps.urls.outputs.has_urls == 'true'
        shell: bash
        env:
          INDEXNOW_KEY: "91c6d8f7a42e4b90bd8a6e3f5c1702aa"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          urls=[u.strip() for u in Path("/tmp/indexnow-urls.txt").read_text().splitlines() if u.strip()]
          payload={
            "host":"riseklix.com",
            "key":os.environ["INDEXNOW_KEY"],
            "keyLocation":"https://riseklix.com/91c6d8f7a42e4b90bd8a6e3f5c1702aa.txt",
            "urlList":urls
          }
          Path("/tmp/indexnow.json").write_text(json.dumps(payload))
          PY

          code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow)"

          echo "IndexNow HTTP $code"
          cat /tmp/indexnow-response.txt || true
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            exit 1
          fi
