name: Social link and product duplicate sweep
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-link-sweep.yml'
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update social URLs and sync product duplicate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = {
              "https://x.com/Riseklixagency": "https://x.com/riseklix",
              "https://x.com/riseklixagency": "https://x.com/riseklix",
              "https://www.instagram.com/riseklix/": "https://www.instagram.com/riseklixai/?hl=en",
              "https://instagram.com/riseklix/": "https://www.instagram.com/riseklixai/?hl=en",
          }
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in {".html", ".md", ".xml", ".txt"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          src = Path("product/index.html")
          if src.exists():
              Path("product.html").write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY
          rm -f .github/workflows/social-link-sweep.yml
      - name: Commit sweep
        shell: bash
        run: |
          git config user.name "Riseklix Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update social links and sync product page"
          git push
