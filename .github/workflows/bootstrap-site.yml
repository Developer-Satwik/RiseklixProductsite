name: Expand Riseklix site bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/site.tar.xz'
      - '.github/workflows/bootstrap-site.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand site source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/riseklix-site
          tar -xJf bootstrap/site.tar.xz -C /tmp/riseklix-site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name bootstrap -exec rm -rf {} +
          cp -a /tmp/riseklix-site/. .
          rm -rf bootstrap .gitkeep .github/workflows/bootstrap-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand Riseklix website source"
          git push origin HEAD:main
