name: Normalize Riseklix entity schema
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-riseklix-entity.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Organization JSON-LD across static HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          canonical = {
              "@type": "Organization",
              "@id": "https://riseklix.com/#organization",
              "name": "Riseklix",
              "alternateName": ["Riseklix Media"],
              "url": "https://riseklix.com/",
              "logo": {
                  "@type": "ImageObject",
                  "@id": "https://riseklix.com/#logo",
                  "url": "https://riseklix.com/assets/riseklix-logo.png",
                  "contentUrl": "https://riseklix.com/assets/riseklix-logo.png",
                  "width": 500,
                  "height": 500
              },
              "image": "https://riseklix.com/assets/riseklix-logo.png",
              "description": "Riseklix builds Commercial Discovery software for AI-mediated buying: researching companies, modeling buyer decisions, checking AI recommendations, tracing supporting evidence, creating action plans, and rechecking what changes.",
              "foundingDate": "2024",
              "email": "contact@riseklix.com",
              "areaServed": "Global",
              "sameAs": [
                  "https://www.linkedin.com/company/riseklix/",
                  "https://www.instagram.com/riseklixai/?hl=en",
                  "https://x.com/riseklix"
              ],
              "knowsAbout": [
                  "commercial discovery",
                  "AI recommendations",
                  "AI visibility",
                  "answer engine optimization",
                  "generative engine optimization",
                  "buyer decision research",
                  "AI search measurement",
                  "competitive intelligence",
                  "AI search monitoring"
              ],
              "contactPoint": {
                  "@type": "ContactPoint",
                  "contactType": "sales",
                  "email": "contact@riseklix.com",
                  "areaServed": "Global",
                  "availableLanguage": ["en"]
              }
          }

          script_re = re.compile(r'<script type="application/ld\+json">(.*?)</script>', re.S)
          changed_files = 0
          changed_entities = 0

          def normalize(node):
              global changed_entities
              if isinstance(node, dict):
                  typ = node.get("@type")
                  typelist = typ if isinstance(typ, list) else [typ]
                  name = str(node.get("name", ""))
                  ident = str(node.get("@id", ""))
                  is_riseklix_org = (
                      "Organization" in typelist and (
                          ident == "https://riseklix.com/#organization"
                          or name in {"Riseklix", "Riseklix Agency", "Riseklix Media"}
                      )
                  )
                  if is_riseklix_org:
                      if node != canonical:
                          node.clear()
                          node.update(canonical)
                          changed_entities += 1
                      return
                  for value in list(node.values()):
                      normalize(value)
              elif isinstance(node, list):
                  for value in node:
                      normalize(value)

          for path in Path(".").rglob("*.html"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              touched = False

              def repl(match):
                  nonlocal_holder = {"touched": False}
                  raw = match.group(1)
                  try:
                      data = json.loads(raw)
                  except Exception:
                      return match.group(0)
                  before = json.dumps(data, sort_keys=True, separators=(",", ":"))
                  normalize(data)
                  after = json.dumps(data, sort_keys=True, separators=(",", ":"))
                  if before != after:
                      nonlocal_holder["touched"] = True
                  if nonlocal_holder["touched"]:
                      nonlocal touched
                      touched = True
                      return '<script type="application/ld+json">' + json.dumps(data, separators=(",", ":")) + '</script>'
                  return match.group(0)

              updated = script_re.sub(repl, text)
              if touched and updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed_files += 1

          print(f"Normalized {changed_entities} Organization objects in {changed_files} HTML files.")
          PY
          rm -f .github/workflows/normalize-riseklix-entity.yml
      - name: Commit normalized entity data
        shell: bash
        run: |
          git config user.name "Riseklix Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize Riseklix entity schema across site"
          git push
